[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-grounded-recsys"
version = "0.1.0"
description = "Evidence-grounded multi-agent recommendation research portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=3,<6"]
local-llm = ["torch>=2.5,<3", "transformers>=4.45,<5", "safetensors>=0.4.5"]
demo = ["gradio>=6.10,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
