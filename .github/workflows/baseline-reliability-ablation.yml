name: Baseline Reliability Ablation (No LLM)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/baseline-reliability-ablation
    paths:
      - '.github/workflows/baseline-reliability-ablation.yml'

permissions:
  contents: read
  actions: read

jobs:
  frozen-posthoc-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline evaluation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run all unit tests
        run: python -m pytest
      - name: Download exactly the original frozen 25-case Qwen output artifact
        run: |
          mkdir -p artifacts/evaluation
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14766315185/zip" > artifacts/evaluation/original.zip
          echo "e6b45b6abf77bff7fdec3167b3b0d4fe82605ca21f2c5868c892040cdfae2635  artifacts/evaluation/original.zip" | sha256sum --check
          unzip -p artifacts/evaluation/original.zip single-agent-baseline-25.json > artifacts/evaluation/original-report.json
      - name: Replay strict, fences-only, fences-plus-flag on identical real outputs
        run: |
          python -m recsys.evaluation.format_ablation \
            --original-report artifacts/evaluation/original-report.json \
            --output artifacts/evaluation/posthoc-format-ablation.json
      - name: Derive separate attribute-evidence fixture without changing baseline catalog
        run: |
          python -m recsys.evaluation.evidence_catalog \
            --source data/retrieval_eval/catalog.json \
            --output artifacts/evaluation/derived_attribute_catalog.json \
            --manifest artifacts/evaluation/derived_attribute_manifest.json
      - name: Export independently reviewable recommendation reasons and evidence
        run: |
          python -m recsys.evaluation.review_queue \
            --report artifacts/evaluation/original-report.json \
            --catalog data/retrieval_eval/catalog.json \
            --output artifacts/evaluation/manual-review-queue.csv
      - name: Verify complete output and no new model inference claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/evaluation")
          data = json.loads((p / "posthoc-format-ablation.json").read_text())
          manifest = json.loads((p / "derived_attribute_manifest.json").read_text())
          assert data["source_run_id"] == 45050806308
          assert data["source_model_invocations"] == 19
          assert data["extra_model_invocations"] == 0
          assert set(data["modes"]) == {"strict", "fences_only", "fences_and_missing_flag"}
          assert all(len(mode["per_case"]) == 25 for mode in data["modes"].values())
          assert manifest["independent_evidence"] is False
          assert manifest["after"]["coverage"] == 1.0
          assert data["unsupported_claim_rate"] is None
          assert data["semantic_citation_groundedness"] is None
          print("Verified frozen-source replay, complete cases, and explicit evidence provenance.")
          PY
      - name: Archive the post-hoc result, synthetic evidence and review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-reliability-frozen-ablation
          path: |
            artifacts/evaluation/posthoc-format-ablation.json
            artifacts/evaluation/derived_attribute_catalog.json
            artifacts/evaluation/derived_attribute_manifest.json
            artifacts/evaluation/manual-review-queue.csv
          if-no-files-found: warn
