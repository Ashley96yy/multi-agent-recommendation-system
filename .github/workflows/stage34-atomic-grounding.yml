name: Stage 3.4 Atomic Claim Grounding Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/atomic-claim-grounding-eval
    paths:
      - '.github/workflows/stage34-atomic-grounding.yml'

permissions:
  contents: read
  actions: read

jobs:
  atomic-claims-and-blind-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline project and tests
        run: python -m pip install -e ".[dev]"
      - name: Run entire repository test suite
        run: python -m pytest
      - name: Evaluate fixed 26 authored atomic claims without an LLM
        run: |
          python -m recsys.evaluation.atomic_claims \
            --cases data/atomic_claim_eval/cases.json \
            --labels data/atomic_claim_eval/author_labels.json \
            --output artifacts/evaluation/stage34-atomic-claims.json \
            --blind-review-csv artifacts/evaluation/stage34-blind-review.csv
      - name: Recover the authentic Stage 3.3 Qwen artifact without inference
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14766939207/zip" > artifacts/evaluation/stage33-original.zip
          echo "7deeceed4226657e90854974dac9c3308251bebf6fb66f148a40bbe8344fa0fc  artifacts/evaluation/stage33-original.zip" | sha256sum --check
          unzip -p artifacts/evaluation/stage33-original.zip stage33-real-qwen-matrix.json > artifacts/evaluation/stage33-original.json
      - name: Export original real Qwen reasons for human atomic claim annotation
        run: |
          python -m recsys.evaluation.model_reason_review \
            --real-report artifacts/evaluation/stage33-original.json \
            --catalog data/retrieval_eval/catalog.json \
            --output artifacts/evaluation/stage34-real-qwen-blind-review.csv \
            --manifest artifacts/evaluation/stage34-real-qwen-review-manifest.json
      - name: Verify separation of labels, typed review and open-text abstention
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("artifacts/evaluation")
          report = json.loads((root / "stage34-atomic-claims.json").read_text())
          assert report["case_count"] == 26
          assert report["typed_case_count"] == 22
          assert report["free_text_review_required_count"] == 4
          assert report["typed_judge"]["author_label_agreement_count"] == 22
          assert report["naive_citation_only_control"]["author_label_agreement_count"] == 8
          assert report["author_labels_independently_adjudicated"] is False
          assert report["free_text_semantic_entailment_measured"] is False
          assert report["real_world_claim_groundedness"] is None
          assert report["unsupported_claim_rate_real_model"] is None
          assert all(len(x) == 64 for x in report["provenance"].values())
          assert sum(row["prediction"] == "needs_human_review" for row in report["per_case"]) == 4
          with (root / "stage34-blind-review.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 26
          assert all("author_label" not in row and "prediction" not in row for row in rows)
          assert all(row["reviewer_label"] == "" for row in rows)
          model = json.loads((root / "stage34-real-qwen-review-manifest.json").read_text())
          assert model["source_run_id"] == 45056291366
          assert model["approved_case_count"] == 9
          assert model["recommendation_reason_rows"] >= 9
          assert model["atomic_claims_manually_extracted"] == 0
          assert model["semantic_groundedness"] is None
          with (root / "stage34-real-qwen-blind-review.csv").open(newline="", encoding="utf-8") as f:
              model_rows = list(csv.DictReader(f))
          assert len(model_rows) == model["recommendation_reason_rows"]
          assert all(row["reviewer_label"] == "" and row["atomic_claim_span"] == ""
                     for row in model_rows)
          print("Fixed authored-claim fixture and real Qwen blind review artifacts validated.")
          PY
      - name: Preserve full predictions, labels, evidence and blind human-review export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-typed-grounding-and-review
          path: |
            artifacts/evaluation/stage34-atomic-claims.json
            artifacts/evaluation/stage34-blind-review.csv
            artifacts/evaluation/stage34-real-qwen-blind-review.csv
            artifacts/evaluation/stage34-real-qwen-review-manifest.json
          if-no-files-found: warn
