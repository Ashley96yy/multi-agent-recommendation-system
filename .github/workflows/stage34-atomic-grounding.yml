name: Stage 3.4 Atomic Claim Grounding Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feature/atomic-claim-grounding-eval
    paths:
      - '.github/workflows/stage34-atomic-grounding.yml'

permissions:
  contents: read

jobs:
  atomic-claims-and-blind-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline project and tests
        run: python -m pip install -e ".[dev]"
      - name: Run entire repository test suite
        run: python -m pytest
      - name: Evaluate fixed 26 authored atomic claims without an LLM
        run: |
          python -m recsys.evaluation.atomic_claims \
            --cases data/atomic_claim_eval/cases.json \
            --labels data/atomic_claim_eval/author_labels.json \
            --output artifacts/evaluation/stage34-atomic-claims.json \
            --blind-review-csv artifacts/evaluation/stage34-blind-review.csv
      - name: Verify separation of labels, typed review and open-text abstention
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("artifacts/evaluation")
          report = json.loads((root / "stage34-atomic-claims.json").read_text())
          assert report["case_count"] == 26
          assert report["typed_case_count"] == 22
          assert report["free_text_review_required_count"] == 4
          assert report["typed_judge"]["author_label_agreement_count"] == 22
          assert report["naive_citation_only_control"]["author_label_agreement_count"] == 8
          assert report["author_labels_independently_adjudicated"] is False
          assert report["free_text_semantic_entailment_measured"] is False
          assert report["real_world_claim_groundedness"] is None
          assert report["unsupported_claim_rate_real_model"] is None
          assert all(len(x) == 64 for x in report["provenance"].values())
          assert sum(row["prediction"] == "needs_human_review" for row in report["per_case"]) == 4
          with (root / "stage34-blind-review.csv").open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 26
          assert all("author_label" not in row and "prediction" not in row for row in rows)
          assert all(row["reviewer_label"] == "" for row in rows)
          print("Fixed authored-claim fixture and blind review artifacts validated.")
          PY
      - name: Preserve full predictions, labels, evidence and blind human-review export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage34-typed-grounding-and-review
          path: |
            artifacts/evaluation/stage34-atomic-claims.json
            artifacts/evaluation/stage34-blind-review.csv
          if-no-files-found: warn
