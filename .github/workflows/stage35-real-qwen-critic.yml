name: Stage 3.5 Real Qwen Evidence Critic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/model-critic-atomic-eval
    paths:
      - '.github/workflows/stage35-real-qwen-critic.yml'

permissions:
  contents: read

jobs:
  qwen-atomic-critic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned CPU PyTorch
        run: python -m pip install --no-cache-dir "torch==2.6.0+cpu" --index-url https://download.pytorch.org/whl/cpu
      - name: Install actual local Qwen runtime and tests
        run: python -m pip install -e ".[dev,local-llm]"
      - name: Run complete offline pytest suite
        run: python -m pytest
      - name: Create blank independent-review sheets without reference answers
        run: |
          python -m recsys.evaluation.human_calibration \
            --packet-dir artifacts/evaluation/stage35-review-packet
      - name: Run real Qwen2.5-0.5B critic once per fixed atomic claim
        run: |
          python -m recsys.evaluation.run_model_critic \
            --max-new-tokens 96 \
            --output artifacts/evaluation/stage35-real-qwen-critic.json
      - name: Verify complete real model traces and no invented human review
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          base = Path("artifacts/evaluation")
          record = json.loads((base/"stage35-real-qwen-critic.json").read_text())
          run = record["generator"]
          scores = record["comparison_against_author_labels"]
          manifest = json.loads((base/"stage35-review-packet"/"stage35-human-review-manifest.json").read_text())
          assert record["suite_id"] == "atomic-claims-fictional-v1"
          assert record["cases_generated"] == 26
          assert run["physical_model_invocations"] == 26
          assert len(run["predictions"]) == 26
          assert all(row["model_calls"] == 1 for row in run["predictions"])
          assert sum(row["generated_tokens"] for row in run["predictions"]) > 0
          assert all(row["raw_model_response"] is not None for row in run["predictions"])
          assert scores["all"]["cases"] == 26
          assert scores["typed"]["cases"] == 22
          assert scores["open_text"]["cases"] == 4
          assert scores["independent_human_review_complete"] is False
          assert scores["human_calibrated_accuracy"] is None
          assert record["human_calibrated_accuracy"] is None
          assert record["real_world_semantic_groundedness"] is None
          assert manifest["reviewer_submissions_received"] == 0
          for reviewer in ("A","B"):
              with (base/"stage35-review-packet"/f"stage35-blind-reviewer-{reviewer}.csv").open(newline="",encoding="utf-8") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==26
              assert all(row["reviewer_label"]=="" and row["reviewer_id"]=="" for row in rows)
              assert all("author_label" not in row and "model_prediction" not in row for row in rows)
          print("All real model calls, author-label comparison and blank review packets validated.")
          PY
      - name: Archive real unmodified Qwen output, per-case decisions and blank human review packets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage35-real-qwen-critic-and-human-review
          path: |
            artifacts/evaluation/stage35-real-qwen-critic.json
            artifacts/evaluation/stage35-review-packet/
          if-no-files-found: warn
